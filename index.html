<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Task Manager</h1>
            <p>Organize your tasks efficiently</p>
        </header>
        <main>
            <form class="task-form" id="task-form">
                <label for="task-input" class="sr-only">Enter a new task</label>
                <input type="text" id="task-input" class="task-input" placeholder="Enter a new task with new Date" required aria-describedby="task-help">
                <small id="task-help" class="sr-only">Press Enter or click Add Task to create a new task</small>
                <button type="submit" class="add-btn">Add Task</button>
            </form>
            <ul class="task-list" id="task-list" aria-label="List of tasks"></ul>
        </main>
        <footer>
            <p>&copy; 2025 Task Manager App</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
